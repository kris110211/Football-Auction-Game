<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Football Auction</title>
<style>
body{margin:0;background:#0f1115;color:#f5f5f5;font:15px Arial}.wrap{max-width:1050px;margin:auto;padding:20px}.card{background:#191c22;border:1px solid #2b2f38;border-radius:14px;padding:18px;margin:12px 0}h1{margin:0}.muted{color:#9ca3af}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}input,select,button{width:100%;padding:11px;border-radius:9px;border:1px solid #373b45;background:#111318;color:#fff;font-size:15px}button{background:#286df6;border:0;font-weight:700;cursor:pointer;margin-top:8px}button.green{background:#219653}button.secondary{background:#333741}.hidden{display:none}.big{font-size:42px;font-weight:800}.timer{font-size:64px;font-weight:900;margin:8px}.row{display:flex;gap:8px}.row button{flex:1}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#30343c;font-size:12px;margin:2px}.t1{background:#70252c}.t2{background:#695218}.t3{background:#225b38}.manager{padding:12px;background:#111419;border-radius:10px;margin:8px 0}.player{text-align:center}.scroll{max-height:300px;overflow:auto;line-height:1.8}.err{color:#ff7474}.warning{color:#ffcf5c}
</style></head><body><div class="wrap"><h1>⚽ Football Auction</h1><div class="muted">1000M • 13–18 players • 7-second live bidding</div>
<div id="home" class="card"><h2>Start</h2><div class="grid"><div><button onclick="create()">CREATE ROOM</button></div><div><input id="joincode" placeholder="Room code"><button onclick="join()">JOIN ROOM</button></div></div><div id="msg" class="muted"></div></div>
<div id="lobby" class="card hidden"><h2>Lobby</h2>Room: <b id="room"></b><div class="grid"><input id="name" placeholder="Manager name"><select id="club"></select></div><button onclick="manager()">JOIN AS MANAGER</button><div id="managers"></div><button id="start" class="green hidden" onclick="start()">START AUCTION</button></div>
<div id="game" class="hidden"><div class="grid"><div class="card player"><div id="tier"></div><h2 id="pname">Waiting</h2><div id="pclub" class="muted"></div><div id="base"></div><div id="timer" class="timer">7</div><div id="bid" class="big">—</div><div id="highest" class="muted"></div><div class="row"><button onclick="bid(10)">+10M</button><button onclick="bid(20)">+20M</button><button onclick="bid(50)">+50M</button></div><button id="unsold" class="secondary hidden" onclick="unsold()">FORCE UNSOLD</button><div id="err" class="err"></div></div><div class="card"><h2>Managers</h2><div id="board"></div></div></div><div class="card"><h2>Players remaining</h2><div id="left" class="scroll"></div></div></div>
</div><script src="/players.js"></script><script>
const clubs=["Manchester City (MCI)","Manchester United (MUN)","Chelsea (CHE)","Liverpool (LIV)","Real Madrid (RMA)","Barcelona (FCB)","Bayern Munich (BAY)","Paris Saint Germain (PSG)","Inter Milan (INT)","AC Milan (MIL)","Juventus (JUV)"];clubs.forEach(c=>{let o=document.createElement("option");o.textContent=c;club.appendChild(o)});
let ws,id,isHost=false,state,clock;const $=x=>document.getElementById(x);
function connect(){ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==="error"){$("msg").textContent=m.message;$("err").textContent=m.message;return}if(m.type==="created"){id=m.id;isHost=true;openLobby(m.room)}if(m.type==="joined"){id=m.id;openLobby(m.room)}if(m.type==="state"){state=m.state;render()}}}
function send(x){if(ws?.readyState===1)ws.send(JSON.stringify(x))}function create(){connect();setTimeout(()=>send({type:"create"}),200)}function join(){connect();let c=$("joincode").value.trim().toUpperCase();setTimeout(()=>send({type:"join",room:c}),200)}function openLobby(c){$("home").classList.add("hidden");$("lobby").classList.remove("hidden");$("room").textContent=c}
function manager(){send({type:"manager",name:$("name").value,club:$("club").value})}function start(){send({type:"start"})}function bid(n){send({type:"bid",amount:n})}function unsold(){send({type:"manual_unsold"})}
function render(){if(!state)return;$("start").classList.toggle("hidden",!(isHost&&!state.started));$("managers").innerHTML=state.managers.map(m=>`<div class="manager"><b>${esc(m.name)} — ${esc(m.club)}</b><br>${m.budget}M • ${m.squad.length}/18 players</div>`).join("");if(!state.started){$("lobby").classList.remove("hidden");$("game").classList.add("hidden");return}$("lobby").classList.add("hidden");$("game").classList.remove("hidden");$("unsold").classList.toggle("hidden",!isHost);if(state.current===null){$("pname").textContent=state.finished?"AUCTION COMPLETE":"WAITING";$("timer").textContent="";return}let p=PLAYERS[state.current];$("tier").innerHTML=`<span class="pill ${p.tier.toLowerCase()}">${p.tier}</span> <span class="pill">${p.pos}</span>`;$("pname").textContent=p.name;$("pclub").textContent=p.club;$("base").textContent="Base "+p.base+"M";$("bid").textContent=state.bid+"M";let hi=state.managers.find(m=>m.id===state.highest);$("highest").textContent=hi?"Highest: "+hi.name:"No bids yet";$("board").innerHTML=state.managers.map(m=>`<div class="manager"><b>${esc(m.name)} — ${esc(m.club)}</b><br>${m.budget}M left • ${m.squad.length}/18<br><span class="muted">${m.squad.map(i=>PLAYERS[i].name).join(", ")}</span></div>`).join("");$("left").innerHTML=state.left.map(i=>{let p=PLAYERS[i];return `${p.name} — ${p.pos} • ${p.tier} • ${p.base}M`}).join("<br>");clearInterval(clock);clock=setInterval(()=>{let sec=Math.max(0,(state.deadline-Date.now())/1000);$("timer").textContent=sec.toFixed(1);if(sec<=0)clearInterval(clock)},50)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
</script></body></html>
