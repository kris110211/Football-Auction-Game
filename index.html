<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Football Auction</title>
<style>
body{margin:0;background:#0f1115;color:#f5f5f5;font:15px Arial}.wrap{max-width:1050px;margin:auto;padding:20px}.card{background:#191c22;border:1px solid #2b2f38;border-radius:14px;padding:18px;margin:12px 0}h1{margin:0}.muted{color:#9ca3af}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}input,select,button{width:100%;padding:11px;border-radius:9px;border:1px solid #373b45;background:#111318;color:#fff;font-size:15px}button{background:#286df6;border:0;font-weight:700;cursor:pointer;margin-top:8px}button.green{background:#219653}button.secondary{background:#333741}.hidden{display:none}button:disabled{opacity:.45;cursor:not-allowed}.big{font-size:42px;font-weight:800}.timer{font-size:64px;font-weight:900;margin:8px}.row{display:flex;gap:8px}.row button{flex:1}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#30343c;font-size:12px;margin:2px}.t1{background:#70252c}.t2{background:#695218}.t3{background:#225b38}.manager{padding:12px;background:#111419;border-radius:10px;margin:8px 0}.player{text-align:center}.scroll{max-height:300px;overflow:auto;line-height:1.8}.err{color:#ff7474}.warning{color:#ffcf5c}
</style></head><body><div class="wrap"><h1>⚽ Football Auction</h1><div class="muted">1000M • 13–18 players • 7-second live bidding</div>
<div id="home" class="card"><h2>Start</h2><div class="grid"><div><button onclick="create()">CREATE ROOM</button></div><div><input id="joincode" placeholder="Room code"><button onclick="join()">JOIN ROOM</button></div></div><div id="msg" class="muted"></div></div>
<div id="lobby" class="card hidden"><h2>Lobby</h2>Room: <b id="room"></b><div class="grid"><input id="name" placeholder="Manager name"><select id="club"></select></div><button id="managerBtn" onclick="manager()">JOIN AS MANAGER</button><div id="managers"></div><button id="start" class="green hidden" onclick="start()">START AUCTION</button></div>
<div id="game" class="hidden"><div class="grid"><div class="card player"><div id="tier"></div><h2 id="pname">Waiting</h2><div id="pclub" class="muted"></div><div id="base"></div><div id="timer" class="timer">7</div><div id="bid" class="big">—</div><div id="highest" class="muted"></div><div class="row"><button class="bidbtn" onclick="bid(10)">+10M</button><button class="bidbtn" onclick="bid(20)">+20M</button><button class="bidbtn" onclick="bid(50)">+50M</button></div><button id="unsold" class="secondary hidden" onclick="unsold()">FORCE UNSOLD</button><div id="err" class="err"></div></div><div class="card"><h2>Managers</h2><div id="board"></div></div></div><div class="card"><h2>Players remaining</h2><div id="left" class="scroll"></div></div></div>
</div><script src="/players.js"></script><script>
